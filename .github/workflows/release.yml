name: Release

# Re-pins the build when a component publishes a release, verifies the jar, and
# publishes a STEPSS release carrying the upstream notes. A manual run always
# publishes, which is how a GUI-only change reaches a release - a dispatch
# alone never would, since only component bumps drive it.
#
# Four of the five pinned components dispatch here on release: ramses, helios,
# dyngraph and codegen. The fifth, uramses, does not, because it only ever
# releases in response to a ramses release under the same tag; the ramses
# dispatch covers both, and the wait step below is what makes that safe.
#
# This replaced a daily schedule. The bump re-pins EVERY component whatever
# woke it, so which one dispatched matters only to that wait step - but the
# self-healing the schedule provided is gone with it. A dispatch that 401s or
# is dropped now means this repo silently stops tracking upstream until someone
# runs it by hand, so a red dispatch job in a component repo is a real failure,
# not noise.
#
# No `${{ }}` expression is ever interpolated into the text of a `run:` script.
# Everything a script needs arrives through `env:` and is read as a quoted
# shell variable, because `${{ }}` is a textual substitution performed before
# bash sees the line: a component release tagged `v1.0";id;"` would otherwise
# close the quote and run arbitrary commands in a job holding STEPSS_TOKEN.
# Nothing validates upstream tag names - pins.version_of only strips a leading
# "v" - so this is the only thing standing between an upstream repo and this
# job's credentials. Keep it that way when adding steps.
on:
  repository_dispatch:
    types: [ramses-release, helios-release, dyngraph-release, codegen-release]
  workflow_dispatch:

# Load-bearing now that four repos can wake this workflow: two components
# releasing close together would otherwise race each other through the bump,
# the version derivation and the push. Serialised rather than cancelled,
# because the loser of a cancel would be a component release that never gets
# pinned.
concurrency:
  group: stepss-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Read by the bundles job below, which cannot see another job's steps.
    outputs:
      proceed: ${{ steps.bump.outputs.proceed }}
      version: ${{ steps.version.outputs.version }}
      # The tag this release supersedes, for the ordering guard in the deb leg.
      # Empty on the first-ever release.
      previous: ${{ steps.version.outputs.previous }}
      # The pin commit the release points at. The legs build THIS, because a
      # draft release has no tag to check out: GitHub creates the tag only when
      # the release is published, which is the whole point of the draft.
      sha: ${{ steps.commit.outputs.sha }}
      # The draft's numeric id. Every attach, the publish and both discards
      # address the release by this, never by tag: the tag does not exist
      # until promote publishes.
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history so the next version can be derived from the existing
          # tags, and STEPSS_TOKEN so the push at the end is authorised.
          fetch-depth: 0
          token: ${{ secrets.STEPSS_TOKEN }}

      # Before the bump, not just before the build: re-pinning URAMSES compiles
      # and runs UramsesKitPack to compute the content-manifest digest, so the
      # bump step needs a JDK too, not only `ant jar`.
      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      # Deliberately ungated: tools/ci decides what gets pinned, built and
      # published, so an edit that breaks it has to fail here rather than
      # halfway through an unattended release. Runs on every invocation,
      # dispatched or manual, before anything is fetched or written.
      - name: Test the release tooling
        run: python3 -m unittest discover -s tools/ci/tests -t .

      # stepss-ramses dispatches here from the same publish job that dispatches
      # to stepss-uramses, so this workflow starts while URAMSES is still
      # refreshing its kits, build-testing three routes and publishing its own
      # release under the SAME tag. Bumping before that lands pins ramses at
      # the new version against uramses at the old one, and cuts a STEPSS
      # release carrying a mismatched pair - with, since the schedule is gone,
      # nothing that would later correct it.
      #
      # Only stepss-uramses is public, so this is the one component lookup that
      # needs no STEPSS_TOKEN; the built-in token is enough and is the smaller
      # credential to expose to a loop over an upstream-supplied tag.
      #
      # Failing here is the intended outcome when URAMSES does not arrive: the
      # Report failure step opens an issue and nothing is published. Do not
      # soften it into a warning, and do not let the bump proceed regardless -
      # a half-pinned release is worse than a loud absent one.
      - name: Wait for the matching URAMSES release
        if: github.event_name == 'repository_dispatch' && github.event.action == 'ramses-release'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMSES_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          # Read from env and quoted, never interpolated into this script: see
          # the note at the top of the file. gh receives the tag as one argv
          # entry, so a hostile tag name cannot become a second argument.
          if [ -z "$RAMSES_TAG" ]; then
            echo "The ramses-release dispatch carried no tag."
            exit 1
          fi
          deadline=$((SECONDS + 900))
          until gh release view "$RAMSES_TAG" --repo SPS-L/stepss-uramses > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "stepss-uramses has not published $RAMSES_TAG within 15 minutes."
              echo "Its sync workflow either failed or is still running; nothing is pinned."
              exit 1
            fi
            echo "waiting for stepss-uramses $RAMSES_TAG ..."
            sleep 30
          done
          echo "stepss-uramses $RAMSES_TAG is published; both pins can move together."

      - name: Re-pin to the latest component releases
        id: bump
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m tools.ci bump > summary.json
          # A line per component, never summary.json itself: its `changed`
          # entries carry the verbatim release bodies of four PRIVATE component
          # repos. On the success path those get published anyway, but a run
          # that fails later at `ant jar` would have disclosed them in this log
          # with no release ever cut. Names and version numbers only.
          python3 - <<'PY'
          import json

          summary = json.load(open("summary.json"))
          for entry in summary["changed"]:
              print("bumped:  %s %s -> %s"
                    % (entry["component"], entry["old_version"],
                       entry["new_version"]))
          for entry in summary.get("refreshed", []):
              print("example: %s %s -> %s"
                    % (entry["example"], entry["old_version"],
                       entry["new_version"]))
          for entry in summary["skipped"]:
              print("skipped: %s pinned %s, upstream %s"
                    % (entry["component"], entry["pinned_version"],
                       entry["upstream_version"]))
          if not summary["changed"] and not summary["skipped"]:
              print("No component moved.")
          PY
          # `changed` only, deliberately: `refreshed` holds the bundled example
          # test systems, and an example repository being tagged is not a reason
          # to publish a new STEPSS, rebuild three installers and rebuild the
          # APT archive. A refreshed example rides along with the next real
          # release instead. If this ever needs to count refreshed too, the
          # thing to change is that judgement, not this line.
          count=$(python3 -c "import json;print(len(json.load(open('summary.json'))['changed']))")
          if [ "$count" -gt 0 ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No component moved and this is a dispatch-driven run; nothing to publish."
          fi

      # Deliberately NOT gated on `proceed`: a tick whose only movement is a
      # refused downgrade leaves `changed` empty, so a dispatch-driven run stops
      # right after the bump - and that is exactly the case somebody has to
      # hear about. Issues live in this repository, so the default
      # GITHUB_TOKEN is enough here, as with the URAMSES caveat below.
      - name: Flag components that were not re-pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(python3 - <<'PY'
          import json

          entries = json.load(open("summary.json"))["skipped"]
          if entries:
              print("The bump refused to re-pin these components:")
              print()
              for entry in entries:
                  print("- **%s**: pinned %s, upstream latest %s - %s"
                        % (entry["component"], entry["pinned_version"],
                           entry["upstream_version"], entry["reason"]))
              print()
              print("The build still carries the pinned versions, and nothing "
                    "was published on their account. Re-pinning downwards "
                    "would rebuild STEPSS on older components and demote the "
                    "newest release, so this is left to a human: either the "
                    "upstream release is a backport and nothing is wrong, or "
                    "the pin has to be moved by hand.")
          PY
          )
          if [ -n "$body" ]; then
            python3 -m tools.ci notify \
              --title "A component release was not pinned" \
              --body "$body" \
              --label release-automation
          fi

      - name: Derive the release version
        id: version
        if: steps.bump.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          version=$(python3 -m tools.ci next-version)
          # for-each-ref rather than `git tag --list | head -n 1`: head exits
          # after the first line, and under `set -o pipefail` the SIGPIPE that
          # kills git turns the whole pipeline into a failure once there are
          # enough tags to fill the pipe buffer. --count=1 asks git for one
          # ref and no pipe is involved. strip=2 rather than :short so a
          # branch sharing a tag's name cannot make git disambiguate the tag
          # as "tags/v3.55". Empty output - no tags at all - is the first-ever
          # release, which the notes composer handles.
          previous=$(git for-each-ref --sort=-v:refname --format='%(refname:strip=2)' --count=1 refs/tags)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # The jar has to know which release it is. The update check compares the
      # copy bundled here against the latest release tag, so a jar shipping the
      # previous number would report itself out of date for the whole life of
      # the release - and this file was hand-maintained until now, tracking the
      # RAMSES version rather than the release, which no step ever wrote.
      # Stamped before `ant jar` so the build picks it up, and committed below
      # so the tree matches what was published.
      - name: Stamp the bundled version
        if: steps.bump.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Bare, without the tag's leading "v": my.stepss.Version.key parses
          # dotted integers and rejects anything else, and StepssUI shows this
          # string to the user as it stands.
          printf '%s\n' "${VERSION#v}" > src/my/stepss/version.txt

      # `ant` happens to be preinstalled on today's ubuntu-latest image, and
      # the build step assumes it silently. Runner images drop tools between
      # versions, so check for it here rather than meet a "command not found"
      # in the middle of a release run. No `|| true`: if ant is neither
      # present nor installable there is no jar to publish and the job must
      # stop. Gated like the build it exists to protect - a run with nothing
      # to publish has no reason to touch apt.
      - name: Ensure ant is available
        if: steps.bump.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if ! command -v ant > /dev/null 2>&1; then
            echo "ant is not on this runner image; installing it."
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          ant -version

      # `ant jar` fetches the pinned payloads from the private component repos
      # through `gh`, so it needs STEPSS_TOKEN just as the bump does. It also
      # runs PayloadManifestCheck, which fails the build if Toolchain.java and
      # the staged payloads disagree.
      - name: Build the jar
        if: steps.bump.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
        run: ant jar

      - name: Verify the bundled toolchain
        if: steps.bump.outputs.proceed == 'true'
        run: java -cp dist/stepss.jar my.stepss.platform.ToolchainDump

      - name: Compose the release notes
        if: steps.bump.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          # "$PREVIOUS" is quoted because it is empty on the first-ever
          # release, and an unquoted empty expansion would drop the argument
          # entirely rather than passing "".
          python3 -m tools.ci notes \
            --version "$VERSION" \
            --summary summary.json \
            --jar dist/stepss.jar \
            --previous "$PREVIOUS" > notes.md
          cat notes.md

      # Nothing above this point writes anything durable: a failure in the
      # build or the toolchain check leaves no commit, no tag and no release.
      - name: Commit and push the pin
        id: commit
        if: steps.bump.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "stepss-release-bot"
          git config user.email "actions@github.com"
          git add versions.properties src/my/stepss/platform/Toolchain.java src/my/stepss/version.txt
          if git diff --cached --quiet; then
            echo "No pin changes to commit (manual release of unchanged sources)."
          else
            git commit -m "Release $VERSION"
            git push origin HEAD:"$REF_NAME"
          fi
          # The release has to point at a commit that exists on the remote,
          # and that is HEAD either way: the else branch just pushed it, and
          # the if branch means HEAD is still the commit that was checked out.
          # GITHUB_SHA is not a substitute - it names the triggering commit,
          # which is the parent of the pin commit, so the release would point
          # one commit behind the versions.properties it actually shipped.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the release as a draft
        id: draft
        if: steps.bump.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag is created by this call, not by a `git tag` + `git push`
          # beforehand. Tagging separately opens a window in which a failure
          # here leaves an orphan tag: the version number is then burnt, since
          # next-version derives the next release from the tags that exist, and
          # a re-run would skip to v3.55.1 with no v3.55 release. One API call
          # creates the tag and the release together or neither, so a failed
          # publish is recoverable by re-running with the same number.
          #
          # --draft, and the promote job below is what clears it. A published
          # release is a promise that every platform is there, and this job
          # finishes before a single installer has been built: three legs then
          # rebuild the jar on their own runners and can each fail on their
          # own. v3.74.17 is the proof - it went out carrying Windows assets
          # and no .deb or .dmg, because two legs hit a transient API 500 while
          # fetching pinned payloads, and apt served the previous version while
          # the release page advertised a new one. A draft creates no tag, is
          # invisible to users, and costs nothing to throw away.
          #
          # An earlier attempt at this same version can have left its draft
          # behind, because the discard step tolerates a failed delete rather
          # than masking the real error. Creating the release would then fail
          # on a tag that already exists, and the version number would be
          # stuck. Remove that draft first, and only ever a draft: `.draft` is
          # checked because a published release under this number must never be
          # deleted by a re-run. This is the one lookup-by-tag left in the
          # workflow, it runs once, and it is allowed to find nothing.
          abandoned="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq 'map(select(.tag_name == env.VERSION and .draft)) | .[0].id // empty' \
            2>/dev/null || true)"
          if [ -n "$abandoned" ]; then
            echo "Removing an abandoned draft for $VERSION from an earlier attempt."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$abandoned" --silent
          fi

          # Created through the REST API rather than `gh release create`, for
          # the release id it hands back. Everything downstream addresses the
          # release by that id, so nothing ever has to resolve a tag that does
          # not exist yet - see tools/attach-asset.sh for what that cost when
          # the legs looked it up by tag instead.
          #
          # jq builds the body so that notes.md, which carries verbatim
          # upstream release text, is JSON-escaped by a tool rather than by
          # hand.
          release_id="$(jq -n \
              --arg tag "$VERSION" \
              --arg target "$TARGET_SHA" \
              --arg name "STEPSS $VERSION" \
              --rawfile body notes.md \
              '{tag_name: $tag, target_commitish: $target, name: $name,
                body: $body, draft: true}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                --input - --jq .id)"
          if [ -z "$release_id" ]; then
            echo "The draft was not created; no id came back."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Draft $VERSION created as release $release_id (no tag yet)."

          bash tools/attach-asset.sh "$release_id" dist/stepss.jar

      # A step used to sit here that asked a human, on every uramses re-pin,
      # whether the README's Compile known-limitation paragraph still held.
      # That paragraph was deleted in 5c9d889 once the kit started carrying the
      # router markers, and the question outlived it by six releases, filing
      # comments about a paragraph that no longer existed. What it was really
      # guarding - that a newly pinned kit still carries the markers
      # RouterSplicer needs - is asserted by UramsesKitPack at pack time now,
      # which fails the build instead of asking.
      #
      # Issues live in this repository, so the default GITHUB_TOKEN is enough
      # here - STEPSS_TOKEN is only needed where the component repos are.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m tools.ci notify \
            --title "Release workflow failed" \
            --body "The release workflow failed. Run: $RUN_URL" \
            --label release-automation

  # Native installers, built after the release exists and attached to it.
  #
  # Deliberately a second job rather than more steps in the first. jpackage
  # only ever builds for the platform it is running on, so this needs three
  # runners, and the jar is the artifact that matters: if a Windows runner
  # fails, the release is already published and complete, and this job goes red
  # next to it instead of taking the release down with it. The ordering is the
  # whole point, so `needs` is not negotiable here.
  #
  # The Linux and Windows legs do more than the macOS one, for the same reason:
  # each has a package manager serving its artifact rather than a person
  # downloading it by hand. Linux checks the version orders, checks the package
  # installs in a clean container, and tells stepss-apt to rebuild. Windows
  # builds a second artifact, the portable app image, and tells stepss-scoop to
  # update its manifest. All of it sits in the legs themselves for the reason
  # the promote job spells out. The dispatches used to live in these legs so a
  # partial release still reached the package managers; they are in promote
  # now, because a partial release is no longer published at all.
  bundles:
    needs: release
    if: needs.release.outputs.proceed == 'true'
    strategy:
      # One platform failing must not cancel the other two: a missing .msi is
      # better than a missing .msi and a missing .deb.
      fail-fast: false
      matrix:
        include:
          # The type is named rather than left to jpackage's platform default,
          # because the default is not always the obvious one: on Windows it is
          # .exe, so asking for the default and then looking for a .msi found
          # nothing and failed the upload after a perfectly good build.
          - os: ubuntu-latest
            type: deb
          - os: windows-latest
            type: msi
          - os: macos-latest
            type: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the commit the release points at
        uses: actions/checkout@v7
        with:
          # The pin commit, not the branch and not the tag. Not the branch,
          # because that would package whatever has landed since under the
          # released version number. Not the tag, because the release is still
          # a draft at this point and GitHub creates the tag only on publish -
          # this is the same commit the draft names as its target.
          ref: ${{ needs.release.outputs.sha }}

      # apt refuses to offer an upgrade to a version that does not sort above
      # the one already installed, and nothing about that looks like a failure:
      # the release publishes, the .deb attaches, the archive serves it, and
      # every existing installation quietly stops moving. tools/ci/release.py
      # derives the version from ramses.version plus a counter, so the ordering
      # holds only while the upstream version string stays dotted digits -
      # pins.version_of strips a leading "v" and validates nothing else. dpkg's
      # own comparison is the authority, because it is the program that will
      # make this decision on every user's machine. First in the leg so a bad
      # ordering costs no build.
      - name: Check the version sorts above the last release
        if: matrix.type == 'deb'
        env:
          NEW_VERSION: ${{ needs.release.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.release.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "No earlier tag; this is the first release and there is nothing to sort above."
            exit 0
          fi
          # Without the tag's leading "v": the bare number is what the .deb
          # carries in Version: and what apt compares.
          new="${NEW_VERSION#v}"
          previous="${PREVIOUS_VERSION#v}"
          if ! dpkg --compare-versions "$new" gt "$previous"; then
            echo "$new does not sort above $previous."
            echo "apt would never offer it as an upgrade to anyone already on $previous."
            exit 1
          fi
          echo "$new sorts above $previous."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Newer than the application's own Java 11 floor, on purpose:
          # jpackage is the tool being used here and it improved a great deal
          # after 11. The runtime it bundles is this one, which is also why the
          # installers do not require any Java on the target machine.
          java-version: "21"

      - name: Build the jar
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
        run: ant jar

      - name: Build a real .icns
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # ImageMagick writes a PNG under an .icns name, which jpackage
          # rejects. iconutil is the only thing that produces the container,
          # and it exists only here, which is why the repository carries the
          # PNG and the ICO but not this.
          mkdir -p stepss.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/stepss.png \
                 --out "stepss.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/stepss.png \
                 --out "stepss.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns stepss.iconset -o packaging/stepss.icns
          file packaging/stepss.icns

      - name: Build the installer
        run: ant bundle "-Dbundle.type=--type ${{ matrix.type }}"

      # Before the upload, so a package that cannot be installed is never
      # published. Docker is on the hosted image already. See the script for why
      # a container is the only place either of the failures it catches shows
      # up: this runner has libgfortran and OpenBLAS for unrelated reasons, and
      # anything that touches a desktop menu succeeds on it.
      - name: Check the package installs and the toolchain resolves
        if: matrix.type == 'deb'
        run: tools/deb-harness.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          # By release id, not by tag: the release is still a draft here and
          # has none. The helper also replaces an asset of the same name, so a
          # re-run of this leg is safe. See tools/attach-asset.sh.
          bash tools/attach-asset.sh "$RELEASE_ID" bundle/*.${{ matrix.type }}

      # The second Windows artifact: the same application as the .msi, as a
      # plain directory in a zip, which is what the Scoop bucket installs.
      #
      # Scoop can extract an .msi instead, and that was the first plan, but it
      # is the route for upstreams that publish nothing else: extraction goes
      # through lessmsi or `msiexec /a` depending on the user's own
      # USE_LESSMSI config, and the layout an installer unpacks into is a
      # property of how it was built rather than anything the manifest can
      # rely on. We publish our own releases, so we can simply publish the
      # portable build and take the route every app that has one takes.
      #
      # After the .msi is uploaded, not before: if this leg is going to fail,
      # it should fail with the installer already attached.
      - name: Build the portable app image
        if: matrix.type == 'msi'
        shell: bash
        env:
          # Same as "Build the jar", because this re-enters `ant jar`. The
          # payloads are cached from that step and stage-payloads skips the
          # network when they are, so this is normally unused; without it, a
          # cache miss would fail as a `gh` auth error rather than a download.
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # No --win-* options reach jpackage for this type; see the condition
          # in build.xml, which jpackage would otherwise fail the build over.
          ant bundle "-Dbundle.type=--type app-image"
          # STEPSS.exe already carries the icon in its own resources, and a
          # .lnk drawn from its target would pick it up. The .ico is copied in
          # beside it because the manifest names an icon file explicitly, and
          # Scoop refuses to create a shortcut whose icon file is missing. That
          # turns losing this line into a loud failure at install time rather
          # than a generic icon nobody reports.
          cp packaging/stepss.ico bundle/STEPSS/STEPSS.ico
          # The STEPSS/ directory goes in at the root of the zip rather than
          # its contents, so unzipping by hand produces one folder instead of
          # scattering a bundled runtime across a download directory. The
          # manifest's extract_dir names that same folder and flattens it, so
          # the two have to agree.
          #
          # 7z, not Compress-Archive: this is ~230MB of app image and the
          # PowerShell cmdlet takes minutes over it.
          version_no_v="${VERSION#v}"
          (cd bundle && 7z a -tzip "STEPSS-${version_no_v}-windows.zip" STEPSS >/dev/null)
          ls -l "bundle/STEPSS-${version_no_v}-windows.zip"

      # A release asset name is a contract with another repository: stepss-scoop
      # builds a download URL out of this exact name and a version, and a
      # renamed asset breaks the manifest for every release cut after it while
      # leaving older tags un-resyncable. Rename it here and there in one pass
      # or not at all.
      - name: Attach the portable app image to the release
        if: matrix.type == 'msi'
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/attach-asset.sh "$RELEASE_ID" bundle/*-windows.zip

  # Nothing is public until every platform is in. The draft the release job
  # created carries no tag and is invisible to users; this job is the only
  # thing that turns it into a release, and it runs only when all three legs
  # succeeded, because a plain `needs:` is skipped when any dependency fails.
  #
  # This reverses the arrangement the dispatch steps used to describe, and the
  # reasoning that justified it. It was true that hanging a dispatch off
  # `needs: [bundles]` skips it whenever one platform fails, and v3.74.8
  # published a .deb and a .dmg and no .msi on the strength of that argument.
  # The conclusion drawn then was to fire each dispatch from inside its own
  # leg so a partial release still reached the package managers. The
  # conclusion now is that a partial release should not exist: v3.74.17 went
  # out with Windows assets and no .deb or .dmg, so apt kept serving the
  # previous version while the release page advertised a new one, and the
  # release had to be repaired by hand. Skipping a dispatch is the correct
  # behaviour when there is nothing worth announcing.
  #
  # The weekly schedules in stepss-apt and stepss-scoop stay: they cost a week
  # rather than forever if a dispatch is dropped, and both runs are idempotent.
  promote:
    needs: [release, bundles]
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The draft names the tag but the tag does not exist until this call, so
      # --verify-tag would fail here. Publishing is what creates it, which is
      # also what keeps a failed run recoverable under the same number: no tag
      # is burnt by a release that never happened.
      - name: Publish the draft
        id: publish
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Read from env and quoted, never interpolated: see the note at the
          # top of the file.
          # By id, and this is the call that creates the tag: GitHub tags
          # target_commitish at the moment a draft stops being a draft.
          # make_latest is the API's string field, not a boolean.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --silent
          echo "$VERSION is published with every platform artifact attached."

      # Both dispatches, now that there is a published release to announce.
      # Ordered apt first only because its rebuild is the slower of the two;
      # neither depends on the other.
      #
      # STEPSS_TOKEN, not a name of its own: one configured secret across the
      # platform is what makes `grep -rho 'secrets\.[A-Z_]*'` answer the
      # question "what real secrets are there" unambiguously. A fine-grained
      # PAT scoped to a repository list has to name each target explicitly, and
      # a dispatch under a token that cannot reach one 401s here rather than
      # failing anywhere downstream - nothing arrives, so nothing goes red over
      # there. That is what this step failing means; do not soften it.
      - name: Tell the APT archive there is a new .deb
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Read from env and quoted, never interpolated into this script: see
          # the note at the top of the file. github.ref_name is NOT the tag
          # here - this workflow runs on repository_dispatch and
          # workflow_dispatch against the default branch, so it is always
          # "main".
          gh api repos/SPS-L/stepss-apt/dispatches \
            -f event_type=stepss-release \
            -f "client_payload[tag]=$VERSION"
          echo "stepss-apt asked to rebuild for $VERSION."

      - name: Tell the Scoop bucket there is a new portable zip
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh api repos/SPS-L/stepss-scoop/dispatches \
            -f event_type=stepss-release \
            -f "client_payload[tag]=$VERSION"
          echo "stepss-scoop asked to update its manifest for $VERSION."

      # A draft that never got published is invisible but not free: it holds
      # the version number's assets and shows up in the repository's release
      # list for maintainers. Discarding it makes a failed run leave nothing
      # at all behind, so re-running reuses the same number cleanly.
      # `steps.publish.outcome`, not a bare failure(): once the draft is
      # published the release is real and must survive. A dispatch failing
      # after that point is a red run and a re-runnable step, not a reason to
      # delete a release users may already have downloaded.
      - name: Discard the draft if publishing failed
        if: failure() && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --silent || true
          echo "Draft $VERSION discarded; no tag was created."

  # The bundles matrix is fail-fast: false, so one platform failing still lets
  # the other two finish and attach. That is worth keeping even though a
  # partial set is never published now: it means one run tells you about every
  # platform that is broken, rather than only the first.
  #
  # This job exists because `promote` is SKIPPED rather than failed when a leg
  # fails, and a skipped job is not a red run. Without it a release that never
  # happened would look green.
  #
  # `result == 'failure' || 'cancelled'`, and not `!= 'success'`: skipped is
  # the third value, and `bundles` is skipped when the release job itself
  # failed before any platform ran. The first form of this condition caught
  # that case and announced "at least one platform failed to build" over a
  # `release not found`, which is a false diagnosis of a run that had already
  # gone red for a different reason. There is nothing to discard then, because
  # the draft is created after the jar is built.
  discard:
    needs: [release, bundles]
    if: >-
      always() && needs.release.outputs.proceed == 'true'
      && (needs.bundles.result == 'failure' || needs.bundles.result == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Discard the draft
        env:
          GH_TOKEN: ${{ secrets.STEPSS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --silent || true
          echo "At least one platform failed to build, so $VERSION was not published."
          echo "The draft is discarded and no tag was created; re-run to retry the same number."
          exit 1
