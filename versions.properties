# Pinned component releases. Update = bump version + digest here, update the
# matching version-suffixed resource name(s) in
# src/my/ramses/platform/Toolchain.java's SPECS to the same version, then
# `ant fetch-payloads` (or just `ant jar`, which runs it via stage-payloads).
# Bumping only this file leaves Toolchain.java pointing at the old asset
# name: the build still stages the new file and still goes green, but every
# launch then fails with "Missing bundled resource" because Toolchain.java
# never asked for the new name. `ant jar`'s -post-compile step
# (PayloadManifestCheck) fails the build if the two are out of sync, but it
# cannot tell you which file to edit — only that they disagree.
