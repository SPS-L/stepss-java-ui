# The example test systems bundled in the jar and offered by File -> Open
# Examples.
#
# This file answers three questions in one place, which is why it exists rather
# than the answers being spread over the dialog, the packer and versions.properties:
#
#   1. what the dialog shows       .name .scale .summary .docs
#   2. which scenario opens it     .cfg
#   3. what gets shipped           derived: cfg + extra
#   4. where the copy lands        .dir
#
# WHICH FILE FILLS WHICH SLOT IS NOT HERE ANY MORE
#
# It is in the .cfg, upstream, beside the data it names. Each example repository
# now ships a scenario file in the current format, and Open Examples loads it
# through my.stepss.config.ScenarioFile exactly as File -> Load configuration
# loads any other. This file used to carry .data, .dist, .obs and .svg keys
# transcribing that mapping, and the transcription was the point: the .cfg files
# the repositories shipped THEN were pre-rewrite Java Properties files full of
# absolute paths from whoever last saved them,
#
#   fileData1=C\:\\Users\\tvanc\\OneDrive\\TRAVAIL\\dat\\Kundur\\lf.dat
#
# which name nothing on a user's machine. Shipping one would have put a .cfg of
# dead paths beside a working generated configuration.
#
# The current format stores a path relative to the .cfg's own directory and
# resolves it against wherever that directory turned out to be, so a case folder
# travels intact. That removed the reason for the transcription, and with it the
# drift: an example that opens on the wrong load flow is now one file to fix, in
# the repository that owns the case, for the Python interface and the GUI alike.
#
# The retain list is still DERIVED, and is not a key of its own. ExamplesPack
# fails the build if an upstream release stops carrying a file named here, so it
# is impossible to ship a file that no entry knows about. It also reads the .cfg
# out of the archive and fails if the scenario names a file .extra forgot, which
# is the half that keeps .extra honest now that it is a flat list rather than a
# set of slots.
#
# STILL NOT RETAINED
#
# The Nordic doc/ (a paper, 3.5 MB of its 3.9 MB) and jupyterhub-tutorial/
# (notebooks, for the Python edition), and the 5-bus tex/ (the assignment
# source). Those are one click away behind .docs instead.
#
# The descriptions are written here rather than parsed from each upstream
# README at run time. A README is prose that changes upstream for reasons that
# have nothing to do with this menu, and parsing one is how a heading edit turns
# into a blank dialog. They are derived from those READMEs; keep them in step
# by hand when an example changes materially.

examples=kundur, nordic, five-bus, six-bus


kundur.name=Kundur two-area
kundur.scale=11 buses, 4 machines, 60 Hz
kundur.summary=Two symmetric areas joined by a weak tie, each with two 900 MVA \
synchronous generators. The standard benchmark for inter-area oscillations: the \
disturbance steps load L9 by +0.5 pu at t = 1 s over a 60 s horizon, and the \
inter-area mode that follows is the object of the study. dyn_noPSS.dat sits \
beside dyn.dat with the stabiliser gain set to zero, so the same run can be \
repeated with the PSS out and the damping compared. RAMSES data by T. Van \
Cutsem. Cite Kundur, Power System Stability and Control, Example 12.6. \
kundur.svg is the annotated one-line diagram: Run Power Flow fills its \
placeholder codes in with the solved voltages, angles and flows.
kundur.docs=https://github.com/SPS-L/stepss-Kundur-Two-Area-System
kundur.dir=kundur-two-area
kundur.cfg=kundur.cfg
kundur.extra=lf.dat, dyn.dat, solveroptions.dat, disturb.dst, obs.dat, \
kundur.svg, dyn_noPSS.dat, README.md, LICENSE


nordic.name=IEEE Nordic
nordic.scale=74 buses, 20 machines, 400/220/130 kV
nordic.summary=The Nordic variant from IEEE PES technical report PES-TR19, the \
reference system for long-term voltage stability and dynamic security \
assessment. It opens on operating point A with a transmission branch tripped, \
which is the case the system is best known for. Beside it are a generator trip, \
a short circuit followed by a trip, an LTC variant, an undisturbed run and the \
Jacobian export used for eigenanalysis, together with operating point B and ten \
load-increase variants from 25 to 500 MW, each with its matching power-flow \
solution. Data by T. Van Cutsem and the IEEE PES task force. Cite PES-TR19. \
nordic.svg is the annotated one-line diagram: Run Power Flow fills its \
placeholder codes in with the solved voltages, angles and flows.
nordic.docs=https://github.com/SPS-L/stepss-IEEE-Nordic-Test-system
nordic.dir=ieee-nordic
nordic.cfg=nordic.cfg
# nordic.cfg opens operating point A with a transmission branch tripped, which
# gives a case that does something the first time Run is pressed. lf_A.dat is
# the network and the operating point, dyn_A.dat the models: since v1.2.0 of the
# test system the dynamic file declares no network of its own, so the same three
# files drive the Dynamic Simulation tab and the Power Flow one. Everything else
# here is what the study is steered with: the other disturbances (nothing.dst
# among them, for an undisturbed run), operating point B, the ten load-increase
# variants and their matching power-flow solutions, and the UVLS controllers.
# cmd.txt is the RAMSES command file for this system and names its files
# relatively, so it travels correctly too.
nordic.extra=lf_A.dat, dyn_A.dat, settings1.dat, trip_branch.dst, obs.dat, \
nordic.svg, volt_rat_A.dat, lf_B.dat, dyn_B.dat, volt_rat_B.dat, uvls.dat, \
nothing.dst, trip_gen.dst, short_trip_branch.dst, \
short_trip_branch_changeLTCs.dst, eigen.dst, dampJac.dst, \
lf_B_plus_25.dat, lf_B_plus_50.dat, lf_B_plus_100.dat, lf_B_plus_250.dat, \
lf_B_plus_275.dat, lf_B_plus_300.dat, lf_B_plus_350.dat, lf_B_plus_375.dat, \
lf_B_plus_400.dat, lf_B_plus_500.dat, \
volt_rat_B_plus25.dat, volt_rat_B_plus50.dat, volt_rat_B_plus100.dat, \
volt_rat_B_plus250.dat, volt_rat_B_plus275.dat, volt_rat_B_plus300.dat, \
volt_rat_B_plus350.dat, volt_rat_B_plus375.dat, volt_rat_B_plus400.dat, \
volt_rat_B_plus500.dat, \
cmd.txt, README.md, LICENSE


five-bus.name=5-bus tutorial
five-bus.scale=5 buses, 1 machine
five-bus.summary=The teaching case from EEN452 at the Cyprus University of \
Technology, and the right thing to open first: one synchronous generator with \
detailed machine, governor and AVR models, a composite load of impedance and \
motors, and an external grid for disturbance studies, small enough to read end \
to end. It opens on operating point 1; lf2solv.dat is the second. nothing.dst \
is an empty disturbance file meant to be extended with the records of the case \
under study, which is how set-point changes, voltage dips, faults and line \
trips are entered. Original exercises by T. Van Cutsem. 5bus.svg is the \
annotated one-line diagram: Run Power Flow fills its placeholder codes in with \
the solved voltages, angles and flows.
five-bus.docs=https://github.com/SPS-L/stepss-5-bus-test-system
five-bus.dir=five-bus-tutorial
five-bus.cfg=5bus.cfg
# lf1/lf2 are the unsolved load flows and lf1solv/lf2solv the solved states;
# 5bus.cfg opens the solved one. 5_bus_oneline.png is the figure from the
# assignment, kept beside the annotated 5bus.svg: a teaching case is read as
# much as it is run, and 230 KB beside the data is worth more than the bytes it
# costs.
five-bus.extra=dyn.dat, lf1solv.dat, solveroptions.dat, nothing.dst, obs.dat, \
5bus.svg, lf1.dat, lf2.dat, lf2solv.dat, 5_bus_oneline.png, README.md, LICENSE


six-bus.name=6-bus microgrid
six-bus.scale=6 buses, 2 generators, 6/11 kV
six-bus.summary=A power-flow-only case: six buses at 6 and 11 kV, two lines, \
four transformers, loads at D and E, and generators at A (slack) and F. There \
is no dynamic data and no disturbance scenario, so this example runs on the \
Power Flow tab and not the Dynamic Simulation one. It is the case the \
annotated one-line diagram is demonstrated with: 6bus.svg is a template \
carrying the placeholder codes, and Run Power Flow fills it in with the solved \
voltages, angles and flows. volt_rat.dat holds the solved bus voltages as the \
VT command writes them. Data by the Sustainable Power Systems Laboratory.
six-bus.docs=https://github.com/SPS-L/stepss-6-bus-MG
six-bus.dir=six-bus-microgrid
six-bus.cfg=6bus.cfg
# 6bus.cfg names no disturbance and no observables file, deliberately: this case
# has neither, and its four recording ticks are all clear. Shipping an empty
# .dst so it looked like the other three would be a file claiming to be a
# disturbance scenario for a case whose own README says it has none.
six-bus.extra=6bus.dat, 6bus.svg, volt_rat.dat, README.md, LICENSE
