annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=STEPSS
application.vendor=Petros Aristidou
auxiliary.org-netbeans-spi-editor-hints-projects.perProjectHintSettingsFile=nbproject/cfg_hints.xml
build.classes.dir=${build.dir}/classes
# .claude/** keeps agent scratch directories out of the jar. They are
# gitignored, so nothing catches them in review, and an untracked
# src/my/stepss/.claude/ was shipping as my/stepss/.claude/ inside
# stepss.jar. The umbrella repo already records one case of a stray
# .claude directory breaking a recursive clone; this is the same class
# of accident reaching the release artifact instead.
build.classes.excludes=**/*.java,**/*.form,**/.claude/**
# This directory is removed when the project is cleaned:
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
# Only compile against the classpath explicitly listed here:
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
# Uncomment to specify the preferred debugger connection transport:
#debug.transport=dt_socket
debug.classpath=\
    ${run.classpath}
debug.modulepath=\
    ${run.modulepath}
debug.test.classpath=\
    ${run.test.classpath}
debug.test.modulepath=\
    ${run.test.modulepath}
# This directory is removed when the project is cleaned:
dist.dir=dist
dist.jar=${dist.dir}/stepss.jar
dist.javadoc.dir=${dist.dir}/javadoc
endorsed.classpath=
excludes=
file.reference.batik-all-1.19.jar=lib\\batik-all-1.19.jar
file.reference.commons-exec-1.3.jar=lib\\commons-exec-1.3.jar
file.reference.commons-io-2.11.0.jar=lib\\commons-io-2.11.0.jar
file.reference.flatlaf-3.7.2.jar=lib\\flatlaf-3.7.2.jar
file.reference.xml-apis-ext-1.3.04.jar=lib\\xml-apis-ext-1.3.04.jar
file.reference.xmlgraphics-commons-2.11.jar=lib\\xmlgraphics-commons-2.11.jar
includes=**
jar.archive.disabled=false
jar.compress=false
jar.index=false
javac.classpath=\
    ${file.reference.commons-exec-1.3.jar}:\
    ${file.reference.commons-io-2.11.0.jar}:\
    ${file.reference.flatlaf-3.7.2.jar}:\
    ${file.reference.batik-all-1.19.jar}:\
    ${file.reference.xmlgraphics-commons-2.11.jar}:\
    ${file.reference.xml-apis-ext-1.3.04.jar}
# Space-separated list of extra javac options
javac.compilerargs=
javac.deprecation=true
javac.external.vm=false
javac.modulepath=
javac.processormodulepath=
javac.processorpath=\
    ${javac.classpath}
javac.source=11
javac.target=11
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.modulepath=\
    ${javac.modulepath}
javac.test.processorpath=\
    ${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
jlink.launcher=false
jlink.launcher.name=stepss
main.class=my.stepss.StepssUI
# Optional override of default Application-Library-Allowable-Codebase attribute identifying the locations where your signed RIA is expected to be found.
manifest.custom.application.library.allowable.codebase=
# Optional override of default Caller-Allowable-Codebase attribute identifying the domains from which JavaScript code can make calls to your RIA without security prompts.
manifest.custom.caller.allowable.codebase=
# Optional override of default Codebase manifest attribute, use to prevent RIAs from being repurposed
manifest.custom.codebase=
# Optional override of default Permissions manifest attribute (supported values: sandbox, all-permissions)
manifest.custom.permissions=
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=false
platform.active=default_platform
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
